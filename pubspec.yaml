name: epitrack
description: Brassard intelligent de détection d'épilepsie tonico-clonique
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_database: ^11.1.4
  firebase_messaging: ^15.1.3
  firebase_storage: ^12.3.0

  # Système de fichiers
  path_provider: ^2.1.4

  # State management
  flutter_riverpod: ^2.5.1
  google_fonts: ^6.2.1

  # Navigation
  go_router: ^13.2.0

  # BLE
  flutter_blue_plus: ^1.32.0

  # HTTP
  http: ^1.2.1
  dio: ^5.4.3

  # Notifications locales
  flutter_local_notifications: ^17.0.0

  # Base de données locale
  sqflite: ^2.3.2
  shared_preferences: ^2.2.3

  # Graphiques
  fl_chart: ^0.68.0

  # Téléphonie
  url_launcher: ^6.2.5

  # Permissions
  permission_handler: ^11.3.1

  # GPS / Carte
  geolocator: ^13.0.0
  flutter_map: ^7.0.0
  latlong2: ^0.9.1

  # PDF
  pdf: ^3.10.8
  printing: ^5.12.0

  # Internationalisation
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true